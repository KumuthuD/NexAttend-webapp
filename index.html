<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexAttend: AI Smart Attendance</title>
  <link rel="icon" href="/components/logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ===== FADE ANIMATIONS ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ===== FLOATING ANIMATIONS ===== */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    @keyframes floatSlow {

      0%,
      100% {
        transform: translateY(0px) translateX(0px);
      }

      25% {
        transform: translateY(-15px) translateX(10px);
      }

      50% {
        transform: translateY(-25px) translateX(0px);
      }

      75% {
        transform: translateY(-15px) translateX(-10px);
      }
    }

    @keyframes floatReverse {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(20px);
      }
    }

    /* ===== GLOW ANIMATIONS ===== */
    @keyframes glow-pulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.1);
      }

      50% {
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.2);
      }
    }

    @keyframes glow-pulse-pink {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(236, 72, 153, 0.3), 0 0 40px rgba(236, 72, 153, 0.1);
      }

      50% {
        box-shadow: 0 0 30px rgba(236, 72, 153, 0.5), 0 0 60px rgba(236, 72, 153, 0.2);
      }
    }

    /* ===== BUTTON GLOW ANIMATION ===== */
    @keyframes buttonGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), 0 0 40px rgba(236, 72, 153, 0.2), inset 0 0 20px rgba(139, 92, 246, 0.1);
      }
      50% {
        box-shadow: 0 0 35px rgba(139, 92, 246, 0.6), 0 0 60px rgba(236, 72, 153, 0.4), inset 0 0 30px rgba(139, 92, 246, 0.15);
      }
    }

    /* ===== BORDER GRADIENT ANIMATION ===== */
    @keyframes borderGradient {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 300% 50%;
      }
    }

    /* ===== SHIMMER EFFECT ===== */
    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    /* ===== GRADIENT BORDER ===== */
    @keyframes gradient-rotate {
      0% {
        --angle: 0deg;
      }

      100% {
        --angle: 360deg;
      }
    }

    @keyframes borderGlow {

      0%,
      100% {
        border-color: rgba(139, 92, 246, 0.3);
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
      }

      50% {
        border-color: rgba(236, 72, 153, 0.5);
        box-shadow: 0 0 25px rgba(236, 72, 153, 0.2);
      }
    }

    /* ===== SCALE ANIMATIONS ===== */
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse-scale {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    /* ===== SPIN ANIMATIONS ===== */
    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* ===== UTILITY CLASSES ===== */
    .animate-fade-in-up {
      animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-fade-in-down {
      animation: fadeInDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-fade-in-left {
      animation: fadeInLeft 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-fade-in-right {
      animation: fadeInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-fade-in {
      animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    .animate-float-slow {
      animation: floatSlow 8s ease-in-out infinite;
    }

    .animate-float-reverse {
      animation: floatReverse 7s ease-in-out infinite;
    }

    .animate-glow-pulse {
      animation: glow-pulse 2s ease-in-out infinite;
    }

    .animate-glow-pulse-pink {
      animation: glow-pulse-pink 2s ease-in-out infinite;
    }

    .animate-border-glow {
      animation: borderGlow 3s ease-in-out infinite;
    }

    .animate-scale-in {
      animation: scaleIn 0.6s ease-out forwards;
      opacity: 0;
    }

    .animate-pulse-scale {
      animation: pulse-scale 2s ease-in-out infinite;
    }

    .animate-spin-slow {
      animation: spin-slow 20s linear infinite;
    }

    /* Shimmer text effect */
    .shimmer-text {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0.1) 100%);
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Glassmorphism card */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.15);
      transform: translateY(-5px);
    }

    /* 3D tilt effect */
    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    .tilt-card:hover {
      transform: perspective(1000px) rotateX(5deg) rotateY(-5deg) scale(1.02);
    }

    /* Gradient border effect */
    .gradient-border {
      position: relative;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
      border-radius: 1rem;
    }

    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), rgba(236, 72, 153, 0.5));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    /* Staggered animation delays */
    .stagger-1 {
      animation-delay: 0.1s;
    }

    .stagger-2 {
      animation-delay: 0.2s;
    }

    .stagger-3 {
      animation-delay: 0.3s;
    }

    .stagger-4 {
      animation-delay: 0.4s;
    }

    .stagger-5 {
      animation-delay: 0.5s;
    }

    .stagger-6 {
      animation-delay: 0.6s;
    }

    .stagger-7 {
      animation-delay: 0.7s;
    }

    .stagger-8 {
      animation-delay: 0.8s;
    }

    /* Button hover glow */
    .btn-glow {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-glow::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent);
      transition: left 0.5s ease;
    }

    .btn-glow:hover::before {
      left: 100%;
    }

    .btn-glow:hover {
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
    }

    /* Floating orb styles */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      pointer-events: none;
    }

    .orb-purple {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
    }

    .orb-pink {
      background: linear-gradient(135deg, #ec4899, #f472b6);
    }

    .orb-blue {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }

    /* ===== STAGGER ANIMATION DELAYS ===== */
    .stagger-1 {
      animation-delay: 0.1s;
    }

    .stagger-2 {
      animation-delay: 0.2s;
    }

    .stagger-3 {
      animation-delay: 0.3s;
    }

    .stagger-4 {
      animation-delay: 0.4s;
    }

    .stagger-5 {
      animation-delay: 0.5s;
    }

    .stagger-6 {
      animation-delay: 0.6s;
    }

    .stagger-7 {
      animation-delay: 0.7s;
    }

    .stagger-8 {
      animation-delay: 0.8s;
    }

    /* Smooth page load - hide content initially */
    .animate-fade-in-up,
    .animate-fade-in-down,
    .animate-fade-in-left,
    .animate-fade-in-right,
    .animate-fade-in {
      opacity: 0;
      will-change: transform, opacity;
    }
  </style>
</head>

<body class="bg-gray-900 text-white">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
